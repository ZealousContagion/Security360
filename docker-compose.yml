services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_GOOGLE_MAPS_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_KEY}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    container_name: security360-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://security360_user:37124819139@db:5432/security360_db
      # NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - db
    networks:
      - security360-network

  db:
    image: postgres:15-alpine
    container_name: security360-db
    restart: always
    environment:
      POSTGRES_USER: security360_user
      POSTGRES_PASSWORD: 37124819139
      POSTGRES_DB: security360_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - security360-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: security360-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - security360-network

networks:
  security360-network:
    driver: bridge

volumes:
  db-data:
